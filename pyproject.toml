[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northwest-iot-observatory"
version = "0.1.0"
description = "A portfolio-grade IoT telemetry, alerting, and visualization platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "paho-mqtt>=2.1,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
iot-server = "iot_platform.main:run"
iot-simulator = "iot_platform.simulator:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iot_platform = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
